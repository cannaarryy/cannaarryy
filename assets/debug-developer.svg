<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <title>Debug the developer — cannaarryy</title>
  <desc>Visual debug scan. Not executable. Follow the markdown links below it to play.</desc>
  <rect width="1198" height="428" x="1" y="1" rx="8" fill="#0A0A0A" stroke="#222222"/>
  <text x="40" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8A8A8A">$ ./debug_developer</text>
  <line x1="1" y1="72" x2="1199" y2="72" stroke="#222222"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="40" y="96" width="420" height="30" rx="4" fill="#111111" stroke="#222222"/>
    <text x="58" y="117" font-size="15" fill="#F5F5F5">[████████████████████] 100%</text>
    <text x="40" y="168" font-size="17" fill="#8A8A8A">&gt; scanning developer........ <tspan fill="#F5F5F5">OK</tspan></text>
    <text x="40" y="202" font-size="17" fill="#8A8A8A">&gt; checking commits.......... <tspan fill="#F5F5F5">OK</tspan></text>
    <text x="40" y="236" font-size="17" fill="#8A8A8A">&gt; checking bugs............. <tspan fill="#38BDF8">4 FOUND</tspan></text>
    <text x="40" y="270" font-size="17" fill="#8A8A8A">&gt; checking sleep_schedule... <tspan fill="#38BDF8">NOT FOUND</tspan></text>
    <line x1="40" y1="298" x2="1160" y2="298" stroke="#222222"/>
    <text x="40" y="332" font-size="15" letter-spacing="2" fill="#8A8A8A">RESULT:</text>
    <text x="40" y="366" font-size="22" fill="#F5F5F5">SYSTEM STATUS: <tspan fill="#38BDF8">DEVELOPER DETECTED</tspan></text>
    <text x="40" y="398" font-size="14" fill="#8A8A8A">[ clasifica los 4 bugs con los enlaces de abajo · triage the 4 bugs with the links below ]</text>
  </g>
</svg>
