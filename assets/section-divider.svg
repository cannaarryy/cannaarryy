<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24">
  <title>Section divider</title>
  <desc>Thin technical rule with a centered accent node.</desc>
  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050505" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#242424"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="11.5" width="1200" height="1" fill="url(#rule)"/>
  <rect x="596" y="8" width="8" height="8" fill="#0A0A0A" stroke="#38BDF8" stroke-width="1.5" transform="rotate(45 600 12)"/>
</svg>
