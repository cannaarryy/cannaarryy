    <text x="68" y="198" font-size="14" fill="#8A8A8A">Desarrollo de Aplicaciones Web</text>
    <rect x="620" y="92" width="540" height="132" rx="6" fill="#0D0D0D" stroke="#222222"/>
    <text x="648" y="132" font-size="13" letter-spacing="2" fill="#8A8A8A">BUILDING // CONSTRUYENDO</text>
    <text x="648" y="170" font-size="20" fill="#F5F5F5">ClientFlow <tspan fill="#38BDF8">[active_project]</tspan></text>
    <text x="648" y="198" font-size="14" fill="#8A8A8A">Full-stack CRM · in development</text>
    <rect x="40" y="236" width="540" height="132" rx="6" fill="#0D0D0D" stroke="#222222"/>
    <text x="68" y="276" font-size="13" letter-spacing="2" fill="#8A8A8A">FOCUS // ENFOQUE</text>
    <text x="68" y="314" font-size="20" fill="#F5F5F5">Web · Backend · APIs · AI</text>
    <text x="68" y="342" font-size="14" fill="#8A8A8A">Automation · Databases</text>
    <rect x="620" y="236" width="540" height="132" rx="6" fill="#0D0D0D" stroke="#222222"/>
    <text x="648" y="276" font-size="13" letter-spacing="2" fill="#8A8A8A">STATUS // ESTADO</text>
    <circle cx="654" cy="308" r="5" fill="#38BDF8"/>
    <text x="668" y="315" font-size="18" fill="#F5F5F5">OPEN TO OPPORTUNITIES</text>
    <text x="648" y="342" font-size="14" fill="#8A8A8A">Abierto a oportunidades</text>
