<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="388" viewBox="0 0 1200 388">
  <title>System status — cannaarryy</title>
  <desc>2x2 status grid: education, building, focus, availability. Bilingual ES/EN.</desc>
  <rect width="1198" height="386" x="1" y="1" rx="8" fill="#0A0A0A" stroke="#222222"/>
  <text x="40" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="3" fill="#F5F5F5">SYSTEM STATUS // ESTADO DEL SISTEMA</text>
  <line x1="40" y1="68" x2="1160" y2="68" stroke="#222222"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="40" y="92" width="540" height="132" rx="6" fill="#0D0D0D" stroke="#222222"/>
    <text x="68" y="132" font-size="13" letter-spacing="2" fill="#8A8A8A">EDUCATION // EDUCACIÓN</text>
